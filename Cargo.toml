[package]
name = "fourcast"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "fourcast — four vision paradigms side-by-side evaluating cats vs dogs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
serde_json = "1.0"
jpeg-decoder = "0.3.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
